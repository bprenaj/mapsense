<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
  <title>MapSense</title>
  <!-- Tray quick panel: right-click on the tray opens this instead of a native
       context menu (Tray App Standard). Visual language is tinomo's tray panel;
       colours are the live MapSense tokens, spending ONE accent. The panel
       carries no brand label: the tray icon just clicked already said whose it is. -->
  <style>
    :root {
      --accent:#00d4ff;
      --bg-0:#080e24; --panel:#0c1730; --panel-2:#121f35; --panel-3:#182b47;
      --accent-dim:rgba(0,212,255,0.16); --accent-glow:rgba(0,212,255,0.38);
      --border:rgba(0,212,255,0.10); --border-strong:rgba(0,212,255,0.25);
      --text:#e6f1ff; --text2:#7f96b2;
      --danger:#ff5252; --warning:#ffb74d; --success:#00e5a0;
      --font-ui:'Chakra Petch','Segoe UI',system-ui,sans-serif;
      --r-sm:8px; --r-md:12px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    /* The window sizes itself to this card (see reportHeight), so neither the
       document nor the body may ever scroll: a stock Windows scrollbar over
       the transparent padding is exactly what we are avoiding. */
    html, body { height:100%; overflow:hidden; }
    body {
      font-family:var(--font-ui); background:transparent; color:var(--text);
      -webkit-font-smoothing:antialiased; font-size:13px; padding:8px;
    }
    .panel {
      display:flex; flex-direction:column; max-height:100%; background:var(--panel);
      border:1px solid var(--border-strong); border-radius:var(--r-md);
      box-shadow:0 18px 60px rgba(0,0,0,0.6); overflow:hidden;
    }
    /* Everything above the footer. On a screen too short for the whole card
       this is the one thing that scrolls, so Open/Log/Quit stay reachable. */
    .scroll { flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; }
    .scroll::-webkit-scrollbar { width:10px; }
    .scroll::-webkit-scrollbar-track { background:transparent; }
    .scroll::-webkit-scrollbar-thumb {
      background:rgba(0,212,255,0.14); border-radius:99px;
      border:3px solid var(--panel); background-clip:padding-box;
    }
    .scroll::-webkit-scrollbar-thumb:hover { background:rgba(0,212,255,0.32); border:3px solid var(--panel); background-clip:padding-box; }
    .grp { padding:6px; }
    .divider { height:1px; background:var(--border); margin:0 10px; }

    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.55;} }
    .status-dot { width:9px; height:9px; border-radius:50%; flex:none; animation:pulse 2.4s infinite; }
    .status-dot.beam-tracking { background:var(--success); box-shadow:0 0 8px rgba(0,229,160,0.6); }
    .status-dot.beam-connecting { background:var(--warning); }
    .status-dot.beam-not_running, .status-dot.beam-not_installed { background:var(--danger); }
    .status-dot.upd-ready { background:var(--accent); box-shadow:0 0 8px var(--accent-glow); }
    .status-dot.upd-busy { background:var(--warning); }
    .status-dot.upd-error { background:var(--danger); }
    .status-dot.upd-idle { background:var(--text2); animation:none; }

    .row {
      display:flex; align-items:center; gap:12px; width:100%;
      padding:9px 10px; background:none; border:none; border-radius:var(--r-sm);
      text-align:left; font-family:var(--font-ui); color:var(--text); cursor:default;
    }
    button.row { cursor:pointer; }
    button.row:hover:not(:disabled) { background:var(--panel-2); }
    /* No row ever OPENS shaded: Chromium freezes the last hover state through
       hide/show, so a row could wear the hover tint the instant the panel
       reappears. Until the mouse really moves inside this showing, hover
       paints nothing; focus never paints. */
    body.no-hover button.row:hover:not(:disabled) { background:none; }
    button.row:focus, button.row:focus-visible { outline:none; }
    button.row:disabled { cursor:default; opacity:0.85; }
    /* A class that sets its own display defeats the [hidden] attribute. */
    .row[hidden], .divider[hidden] { display:none; }

    .dotwrap { width:18px; display:flex; justify-content:center; flex:none; }
    .ico { width:18px; height:18px; flex:none; color:var(--accent); display:flex; }
    .ico svg { width:18px; height:18px; }
    .rtext { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
    .rlabel { font-size:13.5px; font-weight:700; letter-spacing:0.2px; }
    .rdesc {
      font-size:12px; font-weight:400; color:var(--text2);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    .switch { position:relative; width:42px; height:22px; flex:none; }
    .switch input { opacity:0; width:0; height:0; }
    .sw { position:absolute; cursor:pointer; inset:0; background:var(--panel-3); transition:0.25s; border-radius:22px; border:1px solid var(--border); }
    .sw:before { position:absolute; content:""; height:15px; width:15px; left:3px; bottom:2.5px; background:var(--text2); transition:0.25s; border-radius:50%; }
    input:checked+.sw { background:var(--accent-dim); border-color:var(--accent); }
    input:checked+.sw:before { background:var(--accent); transform:translateX(20px); box-shadow:0 0 8px var(--accent-glow); }

    .footer { flex:none; display:flex; gap:6px; padding:8px; border-top:1px solid var(--border); }
    .fbtn {
      flex:1; padding:8px; background:var(--panel-2); border:1px solid var(--border);
      border-radius:var(--r-sm); color:var(--text2); font-family:var(--font-ui);
      font-size:12.5px; font-weight:700; cursor:pointer;
    }
    .fbtn:hover { background:var(--panel-3); color:var(--text); }
    .fbtn.danger:hover { background:var(--danger); color:#fff; border-color:var(--danger); }
  </style>
</head>
<body class="no-hover">
  <div class="panel">
    <div class="scroll">
      <div class="grp">
        <label class="row">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          <span class="rtext">
            <span class="rlabel">Training</span>
            <span class="rdesc" id="trainingText">Not running</span>
          </span>
          <span class="switch"><input type="checkbox" id="trainingToggle"><span class="sw"></span></span>
        </label>
      </div>
      <div class="divider"></div>
      <div class="grp">
        <div class="row">
          <span class="dotwrap"><span class="status-dot beam-connecting" id="beamDot"></span></span>
          <span class="rtext">
            <span class="rlabel">Beam Eye Tracker</span>
            <span class="rdesc" id="beamText">Connecting...</span>
          </span>
        </div>
        <button class="row" id="updateRow">
          <span class="dotwrap"><span class="status-dot upd-idle" id="updateDot"></span></span>
          <span class="rtext">
            <span class="rlabel">Software update</span>
            <span class="rdesc" id="updateText">Up to date</span>
          </span>
        </button>
      </div>
      <div class="divider"></div>
      <div class="grp">
        <button class="row" id="feedbackRow" title="Report a bug or request a feature">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
          <span class="rtext">
            <span class="rlabel">Feedback</span>
            <span class="rdesc">Report a bug or request a feature</span>
          </span>
        </button>
        <button class="row" id="discordRow" title="Chat with the developer on Discord">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h.01M16 12h.01"/><path d="M8.5 4.5 7 3 4.5 4A16 16 0 0 0 3 12a16 16 0 0 0 1.5 8L7 21l1.5-2"/><path d="m15.5 4.5 1.5-1.5L19.5 4A16 16 0 0 1 21 12a16 16 0 0 1-1.5 8L17 21l-1.5-2"/><path d="M8 17.5a12 12 0 0 0 8 0"/></svg></span>
          <span class="rtext">
            <span class="rlabel">Chat with the developer</span>
            <span class="rdesc">Join the Discord</span>
          </span>
        </button>
      </div>
    </div>
    <div class="footer">
      <button class="fbtn" id="openBtn">Open</button>
      <button class="fbtn" id="logBtn">Log</button>
      <button class="fbtn danger" id="quitBtn">Quit</button>
    </div>
  </div>
  <script src="trayPanel.js"></script>
</body>
</html>
